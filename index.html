<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LG Subscribe PV System</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172338;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#142744;color:white;padding:22px 18px 16px}header h1{font-size:22px;margin:0 0 5px}header small{color:#bcd0e8}main{max-width:850px;margin:auto;padding:16px 14px 100px}.notice{background:#fff3d8;color:#775016;padding:12px;border-radius:12px;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap;background:white;color:#263c58}.tabs button.active{background:#2459c4;color:white}button{border:0;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer;background:#2459c4;color:white}button.secondary{background:#e8eef7;color:#263c58}button.danger{background:#ffe5e5;color:#a52c2c}.panel{background:white;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #19365d0b}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:10px 0}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f0f5ff;border-radius:12px;padding:14px}.metric strong{display:block;font-size:23px;color:#1749ad;margin-top:6px}.metric span{font-size:12px;color:#61718b}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dfec;border-radius:10px;background:white;color:#18253a;font:inherit}input[type=checkbox]{width:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.grid .full{grid-column:1/-1}.muted{color:#6a778b;font-size:13px}.entry{border-top:1px solid #edf0f5;padding:12px 0}.entry:first-of-type{border:0}.entry b{display:block}.entry small{color:#64748b}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.right{margin-left:auto}.hidden{display:none!important}.tag{display:inline-block;border-radius:8px;padding:4px 8px;background:#e8f1ff;color:#1e58a4;font-size:12px}.total{font-size:24px;font-weight:800;color:#1749ad}.foot{font-size:12px;color:#68778b;line-height:1.5}nav{position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -2px 16px #0001;display:flex;justify-content:space-around;padding:9px 5px max(9px,env(safe-area-inset-bottom))}nav button{font-size:12px;padding:10px 8px;background:transparent;color:#45617d}nav button.active{background:#eaf1ff;color:#1b55b7}@media(max-width:420px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><h1>LG Subscribe PV System</h1><small>Order • PV • Commission Management</small></header><main><div class="notice">⚠️ 测试版：资料只保存在这台设备的这个浏览器，清除网站数据可能会遗失。尚未设置安全数据库，请勿输入真实顾客个人资料。</div><div class="tabs" id="tabs"></div><section id="dashboard" class="page"></section><section id="add" class="page hidden"><div class="panel"><h2>Add Order</h2><form id="orderForm"><div class="grid"><div><label>Agent</label><select id="agent" required></select></div><div><label>Order Number</label><input id="order" required placeholder="TEST-001"></div><div><label>Customer (test data only)</label><input id="customer" placeholder="Test Customer"></div><div><label>Category</label><select id="category"></select></div><div><label>Product / Model</label><input id="product" placeholder="e.g. WD516"></div><div><label>Order Type</label><select id="type"><option value="subscribe">Subscribe</option><option value="cash">Cash Buy</option></select></div><div><label>Contract</label><select id="contract"><option value="5">5 Years</option><option value="7">7 Years</option></select></div><div><label>Normal Monthly Fee (RM)</label><input id="fee" type="number" min="0" step="0.01" required></div><div><label>Offer</label><select id="offer"><option value="normal">Normal / 9 Months 50% Off</option><option value="special">Special Price (fee already discounted)</option><option value="bundle">Existing+New / New+New (-RM10)</option></select></div><div><label>Status</label><select id="status"><option value="Pending">Pending (Waiting List)</option><option value="Installed">Installed</option></select></div><div id="dateWrap" class="hidden"><label>Installation Date</label><input id="installDate" type="date"></div><div id="cashWrap" class="hidden"><label>Cash Original Price (RM)</label><input id="cashPrice" type="number" min="0" step="0.01"><label>Cash PV (manual)</label><input id="cashPV" type="number" min="0" step="0.01"></div></div><p class="muted" id="preview">PV: 0</p><button type="submit">Save Order</button></form></div></section><section id="orders" class="page hidden"></section><section id="commission" class="page hidden"></section><section id="agents" class="page hidden"><div class="panel"><h2>Agent Management</h2><div id="agentList"></div><label>New Agent Name</label><input id="newAgent" placeholder="Agent name"><label>Agent Code</label><input id="newCode" placeholder="LGM..."> <p><button onclick="addAgent()">Add Agent</button></p></div></section></main><nav id="bottomNav"></nav><script>
const KEY='lg-subscribe-pv-demo-v1';const defaults={agents:[{name:'WILLIE LIM',code:'LGM121099'},{name:'LIEU WEI TIAN',code:'LGM214656'}],orders:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};if(!Array.isArray(state.agents)||!Array.isArray(state.orders))state=structuredClone(defaults);const $=id=>document.getElementById(id);const money=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const tabs=[['dashboard','Dashboard'],['add','Add Order'],['orders','Orders'],['commission','Commission'],['agents','Agents']];let current='dashboard';function navigate(page){current=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('hidden',el.id!==page));$('tabs').innerHTML=tabs.map(([id,n])=>`<button class="${id===page?'active':''}" onclick="navigate('${id}')">${n}</button>`).join('');$('bottomNav').innerHTML=tabs.map(([id,n])=>`<button class="${id===page?'active':''}" onclick="navigate('${id}')">${n}</button>`).join('');render()};const categories=['Water Purifier','Air Purifier','Washer','Dryer','WashTower','TV','Refrigerator','Air Conditioner','Dishwasher','Styler'];$('category').innerHTML=categories.map(c=>`<option>${c}</option>`).join('');function calc(o){if(o.type==='cash')return Number(o.cashPV||0);let fee=Number(o.fee||0)-(o.offer==='bundle'?10:0);return Math.max(0,fee)*(o.contract==='7'?20:17)+(o.category==='Water Purifier'&&o.installDate<='2026-12-31'&&o.installDate>='2026-01-01'?300:0)}function activePV(o){return o.status==='Installed'?calc(o):0}function updateForm(){const installed=$('status').value==='Installed',cash=$('type').value==='cash';$('dateWrap').classList.toggle('hidden',!installed);$('installDate').required=installed;$('cashWrap').classList.toggle('hidden',!cash);$('fee').required=!cash;$('preview').textContent='Estimated PV: '+calc({type:$('type').value,fee:$('fee').value,offer:$('offer').value,contract:$('contract').value,category:$('category').value,installDate:$('installDate').value,cashPV:$('cashPV').value}).toLocaleString()};['status','type','fee','offer','contract','category','installDate','cashPV'].forEach(id=>$(id).addEventListener('input',updateForm));function render(){const month=new Date().toISOString().slice(0,7);$('agent').innerHTML=state.agents.map(a=>`<option value="${esc(a.code)}">${esc(a.name)} (${esc(a.code)})</option>`).join('');const installed=state.orders.filter(o=>o.status==='Installed'),pending=state.orders.filter(o=>o.status==='Pending'),thisMonth=installed.filter(o=>o.installDate?.slice(0,7)===month),pv=thisMonth.reduce((a,o)=>a+activePV(o),0);$('dashboard').innerHTML=`<div class="panel"><h2>Overview · ${month}</h2><div class="metrics"><div class="metric"><span>Monthly PV</span><strong>${pv.toLocaleString()}</strong></div><div class="metric"><span>Installed Orders</span><strong>${thisMonth.length}</strong></div><div class="metric"><span>Waiting List</span><strong>${pending.length}</strong></div><div class="metric"><span>Gap to 15,000</span><strong>${Math.max(0,15000-pv).toLocaleString()}</strong></div><div class="metric"><span>Gap to 22,100</span><strong>${Math.max(0,22100-pv).toLocaleString()}</strong></div><div class="metric"><span>All Installed</span><strong>${installed.length}</strong></div></div></div><div class="panel"><h2>Agent PV · ${month}</h2>${state.agents.map(a=>`<div class="entry"><b>${esc(a.name)}</b><small>${esc(a.code)}</small><p class="total">${thisMonth.filter(o=>o.agent===a.code).reduce((s,o)=>s+activePV(o),0).toLocaleString()} PV</p></div>`).join('')}</div>`;$('orders').innerHTML=`<div class="panel"><h2>Orders (${state.orders.length})</h2><label>Filter</label><select id="orderFilter" onchange="drawOrders()"><option value="all">All Orders</option><option value="Pending">Waiting List</option><option value="Installed">Installed</option></select><div id="orderRows"></div></div>`;drawOrders();$('commission').innerHTML=`<div class="panel"><h2>Commission · ${month}</h2><p class="muted">Basic Subscribe Commission = Product PV × 15%. First month 70%; remaining 30% paid over 23 months, subject to eligibility. Performance Bonus tiers are not configured yet.</p>${state.agents.map(a=>{const os=thisMonth.filter(o=>o.agent===a.code),sub=os.filter(o=>o.type==='subscribe'),cash=os.filter(o=>o.type==='cash'),basic=sub.reduce((s,o)=>s+calc(o)*.15,0),cashCom=cash.reduce((s,o)=>s+Number(o.cashPrice||0)*.13,0);return `<div class="entry"><b>${esc(a.name)}</b><p>Subscribe PV: ${sub.reduce((s,o)=>s+calc(o),0).toLocaleString()}</p><p>Basic Commission: <strong>${money(basic)}</strong></p><p>First Month 70%: <strong>${money(basic*.7)}</strong></p><p>Deferred 30%: ${money(basic*.3)} (${money(basic*.3/23)}/month)</p><p>Cash Buy Commission (13%): <strong>${money(cashCom)}</strong></p></div>`}).join('')}<p class="foot">Not included: Performance Bonus, Support Fund, historic deferred installments, 12-month net-sale eligibility, manual adjustments, and paid-commission reconciliation. Do not use as a final payroll statement.</p></div>`;$('agentList').innerHTML=state.agents.map(a=>`<div class="entry"><b>${esc(a.name)}</b><small>${esc(a.code)}</small></div>`).join('')};function drawOrders(){let f=$('orderFilter')?.value||'all',rows=state.orders.filter(o=>f==='all'||o.status===f);$('orderRows').innerHTML=rows.length?rows.map(o=>`<div class="entry"><div class="flex"><b>${esc(o.order)}</b><span class="tag">${esc(o.status)}</span></div><small>${esc(o.customer||'Test customer')} · ${esc(o.agent)} · ${esc(o.product||o.category)}</small><p>${activePV(o).toLocaleString()} PV · ${esc(o.installDate||'Waiting for installation')}</p><div class="flex">${o.status==='Pending'?`<button class="secondary" onclick="markInstalled('${o.id}')">Mark Installed</button>`:''}<button class="secondary" onclick="editDate('${o.id}')">${o.status==='Installed'?'Change Date':'Change Status'}</button><button class="danger" onclick="removeOrder('${o.id}')">Remove</button></div></div>`).join(''):'<p class="muted">No orders yet.</p>'};$('orderForm').addEventListener('submit',e=>{e.preventDefault();let order=$('order').value.trim();if(state.orders.some(o=>o.order===order)){alert('Order Number already exists');return}let o={id:crypto.randomUUID(),agent:$('agent').value,order,customer:$('customer').value.trim(),category:$('category').value,product:$('product').value.trim(),type:$('type').value,contract:$('contract').value,fee:Number($('fee').value||0),offer:$('offer').value,status:$('status').value,installDate:$('status').value==='Installed'?$('installDate').value:'',cashPrice:Number($('cashPrice').value||0),cashPV:Number($('cashPV').value||0),createdAt:new Date().toISOString()};state.orders.push(o);save();e.target.reset();updateForm();navigate('orders')});function markInstalled(id){const date=prompt('Installation Date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!date||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)||Number.isNaN(Date.parse(date)))return alert('Invalid date');let o=state.orders.find(o=>o.id===id);o.status='Installed';o.installDate=date;save();render()};function editDate(id){let o=state.orders.find(o=>o.id===id);if(o.status==='Pending')return markInstalled(id);let date=prompt('New Installation Date (YYYY-MM-DD), or type PENDING to move back to Waiting List',o.installDate);if(date===null)return;if(date.trim().toUpperCase()==='PENDING'){o.status='Pending';o.installDate=''}else if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)&&!Number.isNaN(Date.parse(date))){o.installDate=date}else return alert('Invalid date');save();render()};function removeOrder(id){if(!confirm('Remove this order from the demo? This action cannot be undone.'))return;state.orders=state.orders.filter(o=>o.id!==id);save();render()};function addAgent(){let name=$('newAgent').value.trim(),code=$('newCode').value.trim();if(!name||!code)return alert('Enter name and code');if(state.agents.some(a=>a.code===code))return alert('Agent Code already exists');state.agents.push({name,code});save();$('newAgent').value='';$('newCode').value='';render()};updateForm();navigate('dashboard');
</script></body></html>
